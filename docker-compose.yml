name: taskservice

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tasks}
      MYSQL_USER: ${MYSQL_USER:-tasks}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: taskservice-api:latest
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}

      HTTP_ADDR: ":8080"
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}

      STARTUP_RETRY_ATTEMPTS: ${STARTUP_RETRY_ATTEMPTS:-30}
      STARTUP_RETRY_INTERVAL: ${STARTUP_RETRY_INTERVAL:-2s}

      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tasks}
      MYSQL_USER: ${MYSQL_USER:-tasks}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-25}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-25}
      MYSQL_CONN_MAX_LIFETIME: ${MYSQL_CONN_MAX_LIFETIME:-5m}

      REDIS_ADDR: redis:6379

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}

      CACHE_TASKS_TTL: ${CACHE_TASKS_TTL:-5m}
      CACHE_INVALIDATE_TIMEOUT: ${CACHE_INVALIDATE_TIMEOUT:-2s}
      CACHE_INVALIDATE_RETRY_INTERVAL: ${CACHE_INVALIDATE_RETRY_INTERVAL:-1s}
      CACHE_BREAKER_FAILURES: ${CACHE_BREAKER_FAILURES:-5}
      CACHE_BREAKER_OPEN_TIMEOUT: ${CACHE_BREAKER_OPEN_TIMEOUT:-10s}
      CACHE_BREAKER_HALF_OPEN_REQUESTS: ${CACHE_BREAKER_HALF_OPEN_REQUESTS:-1}

      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      RATE_LIMIT_CLIENT_TTL: ${RATE_LIMIT_CLIENT_TTL:-3m}
      RATE_LIMIT_CLEANUP_INTERVAL: ${RATE_LIMIT_CLEANUP_INTERVAL:-1m}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:26.2.3
    profiles: ["tools"]
    environment:
      CB_SERVER_NAME: Task Service DB
      CB_SERVER_URL: http://localhost:${CLOUDBEAVER_PORT:-8978}
      CB_ADMIN_NAME: ${CLOUDBEAVER_ADMIN:-cbadmin}
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_ADMIN_PASSWORD:-ChangeMe123}
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "true"
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
    configs:
      - source: cloudbeaver-data-sources
        target: /opt/cloudbeaver/conf/initial-data-sources.conf
    volumes:
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace
    ports:
      - "127.0.0.1:${CLOUDBEAVER_PORT:-8978}:8978"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

configs:
  cloudbeaver-data-sources:
    content: |
      {
        "folders": {},
        "connections": {
          "taskservice-mysql": {
            "provider": "mysql",
            "driver": "mysql8",
            "name": "Task Service (MySQL)",
            "save-password": true,
            "read-only": false,
            "configuration": {
              "host": "mysql",
              "port": "3306",
              "database": "${MYSQL_DATABASE:-tasks}",
              "url": "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tasks}",
              "type": "dev",
              "auth-model": "native",
              "user": "${MYSQL_USER:-tasks}",
              "password": "${MYSQL_PASSWORD}",
              "properties": {
                "allowPublicKeyRetrieval": "true",
                "useSSL": "false"
              }
            }
          }
        }
      }

volumes:
  mysql-data:
  cloudbeaver-workspace:
